
# Control Room Configuration
control_room:
  # API Server Configuration
  api:
    host: "localhost"
    port: 8080
    cors_enabled: true
    max_request_size: 10485760  # 10MB
    
  # WebSocket Server Configuration
  websocket:
    host: "localhost"
    port: 8765
    ping_interval: 20
    ping_timeout: 10
    max_message_size: 1048576  # 1MB
    max_queue_size: 32
    
  # System Monitoring Configuration
  monitoring:
    interval: 5  # seconds
    history_size: 1000
    save_history: true
    history_path: "./data/system_metrics_history.json"
    
    # Alert thresholds
    cpu_alert_threshold: 80
    memory_alert_threshold: 85
    disk_alert_threshold: 90
    
  # Metrics Collection Configuration
  metrics:
    interval: 10  # seconds
    max_metrics_per_type: 1000
    save_on_shutdown: true
    metrics_path: "./data/metrics_history.json"
    load_history: true
    
  # Notification Configuration
  notification:
    interval: 2  # seconds
    max_notifications: 500
    auto_cleanup_days: 7
    
  # User Profile Configuration
  profiles:
    profiles_path: "./data/user_profiles.json"
    default_theme: "dark"
    default_refresh_interval: 5
    
  # Logging Configuration
  logging:
    level: "INFO"
    file: "./logs/control_room.log"
    max_file_size: 10485760  # 10MB
    backup_count: 5
    
  # Security Configuration
  security:
    enable_auth: false  # Set to true in production
    session_timeout: 3600  # 1 hour
    max_login_attempts: 5
    
  # Performance Configuration
  performance:
    max_concurrent_requests: 100
    request_timeout: 30
    cache_enabled: true
    cache_ttl: 300  # 5 minutes

# Integration with existing EirosAgent configuration
app:
  name: "EirosAgent Control Room"
  version: "3.0.0"
  debug: false
  log_level: "INFO"

# Extend existing web automation config
web_automation:
  browser:
    type: "chromium"
    headless: true
    timeout: 30000
    viewport:
      width: 1920
      height: 1080
  
  javascript:
    injection_timeout: 5000
    max_retries: 3
    enable_stealth: true
  
  forms:
    auto_fill: true
    validation: true
    submit_delay: 1000

# Extend existing OCR config
ocr:
  engines:
    primary: "easyocr"
    fallback: "paddleocr"
    
  easyocr:
    languages: ["en", "ru"]
    gpu: true
    confidence_threshold: 0.5
    
  paddleocr:
    languages: ["en", "ru"] 
    use_angle_cls: true
    use_space_char: true
    
  tesseract:
    config: "--oem 3 --psm 6"
    languages: "eng+rus"
    
  preprocessing:
    enhance_contrast: true
    denoise: true
    resize_factor: 2.0

# Extend existing scheduler config
scheduler:
  max_concurrent_tasks: 10
  task_timeout: 300
  retry_attempts: 3
  retry_delay: 5
  
  storage:
    type: "file"
    path: "./data/tasks"

# Extend existing vision config
vision:
  screen_capture:
    format: "png"
    quality: 90
    region_detection: true
    
  analysis:
    object_detection: true
    text_detection: true
    similarity_threshold: 0.8

# Extend existing logging config
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {message}"
  file: "./logs/eiros_agent.log"
  rotation: "1 day"
  retention: "30 days"
